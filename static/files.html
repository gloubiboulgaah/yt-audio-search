<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vidéos · Audio-search</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main>
<h1>Vidéos</h1>
<div class="toolbar">
  <input type="search" id="filter" placeholder="Filtrer par titre ou chaîne" aria-label="Filtrer">
  <label class="row muted"><input type="checkbox" id="all"> Tout sélectionner</label>
  <button class="danger" id="del" disabled>Supprimer la sélection</button>
</div>
<div id="list"></div>
</main>
<script src="/static/app.js"></script>
<script>
let videos = [];
const boxes = () => [...document.querySelectorAll('#list input:checked')];
const sync = () => { const n = boxes().length; $('#del').disabled = !n; $('#del').textContent = n ? `Supprimer ${n} vidéo${n > 1 ? 's' : ''}` : 'Supprimer la sélection'; };
async function remove(ids) {
  if (!confirm(`Supprimer ${ids.length} vidéo${ids.length > 1 ? 's' : ''} de l'appli ? Leurs signets sont supprimés aussi. Les fichiers vidéo téléchargés restent sur le disque.`)) return;
  for (const id of ids) await api('/api/videos/' + encodeURIComponent(id), undefined, 'DELETE');
  load();
}
function render() {
  const q = $('#filter').value.toLowerCase();
  const shown = videos.filter(v => (v.title + v.id + (v.channel || '')).toLowerCase().includes(q));
  if (!videos.length) return $('#list').replaceChildren(h('div', { class: 'empty panel' }, icon('plus'), h('b', {}, 'Aucune vidéo'), h('a', { href: '/upload' }, 'Ajouter une vidéo ou une playlist')));
  $('#list').replaceChildren(h('div', { class: 'list' }, shown.map(v => {
    const href = `/video?id=${encodeURIComponent(v.id)}`;
    return h('div', { class: 'item link', onclick: e => { if (!e.target.closest('input, button, a')) location.href = href; } },
      h('input', { type: 'checkbox', value: v.id, onchange: sync, 'aria-label': `Sélectionner « ${v.title} »` }),
      thumb(v.id, v.title, null, v.duration),
      h('div', { class: 'grow' },
        h('a', { class: 'title', href }, v.title),
        h('div', { class: 'facts' },
          v.channel && h('span', {}, icon('user'), v.channel),
          h('span', {}, icon('text'), `${fmtNum(v.nwords)} mots`),
          h('span', {}, icon('clock'), `ajoutée le ${new Date(v.added * 1000).toLocaleDateString('fr-FR')}`))),
      v.full ? h('span', { class: 'chip ok' }, icon('check'), 'Hors ligne') : v.nclips ? h('span', { class: 'chip ok' }, icon('check'), `${v.nclips} extrait${v.nclips > 1 ? 's' : ''}`) : h('span', { class: 'chip' }, 'En ligne'),
      h('button', { class: 'iconbtn', title: 'Supprimer', 'aria-label': `Supprimer « ${v.title} »`, onclick: () => remove([v.id]) }, icon('trash')));
  })));
  $('#all').checked = false; sync();
}
async function load() { videos = await api('/api/videos'); render(); }
$('#filter').addEventListener('input', render);
$('#all').addEventListener('change', e => { document.querySelectorAll('#list input').forEach(b => b.checked = e.target.checked); sync(); });
$('#del').addEventListener('click', () => remove(boxes().map(b => b.value)));
document.addEventListener('clip', load);
load();
</script>
</body></html>

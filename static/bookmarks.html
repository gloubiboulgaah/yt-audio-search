<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Signets · Audio-search</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main>
<h1>Signets</h1>
<div class="layout">
  <aside class="panel cats" aria-label="Catégories">
    <ul id="cats"></ul>
    <form id="newcat" class="row">
      <input class="grow" id="catname" placeholder="Nouvelle catégorie" aria-label="Nom de la nouvelle catégorie" required>
      <button class="small" aria-label="Créer la catégorie"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
    </form>
  </aside>
  <section>
    <div class="toolbar"><input type="search" id="filter" placeholder="Filtrer par texte ou titre" aria-label="Filtrer les signets"></div>
    <div id="list"></div>
  </section>
</div>
</main>
<script src="/static/app.js"></script>
<script>
let cats = [], bms = [], cur = 'all';

async function load() {
  [cats, bms] = await Promise.all([api('/api/categories'), api('/api/bookmarks')]);
  render();
}

function render() {
  const item = (key, label, n, ...extra) => h('li', {}, h('button', { class: 'cat' + (cur == key ? ' on' : ''), 'aria-pressed': String(cur == key), onclick: () => { cur = key; render(); } }, h('span', {}, label), h('span', { class: 'muted' }, String(n))), ...extra);
  $('#cats').replaceChildren(
    item('all', 'Tous les signets', bms.length),
    item('none', 'Sans catégorie', bms.filter(b => !b.category_id).length),
    ...cats.map(c => item(c.id, c.name, c.count,
      h('button', { class: 'iconbtn', title: 'Renommer', 'aria-label': `Renommer ${c.name}`, onclick: () => renameCat(c) }, icon('pencil')),
      h('button', { class: 'iconbtn', title: 'Supprimer', 'aria-label': `Supprimer ${c.name}`, onclick: async () => {
        if (!confirm(`Supprimer la catégorie « ${c.name} » ? Ses signets sont gardés, dans « Sans catégorie ».`)) return;
        await api('/api/categories/' + c.id, undefined, 'DELETE');
        if (cur == c.id) cur = 'all';
        load();
      } }, icon('trash')))));
  const q = $('#filter').value.toLowerCase();
  const shown = bms.filter(b => (cur === 'all' || (cur === 'none' ? !b.category_id : b.category_id == cur)) && (b.text + b.title).toLowerCase().includes(q));
  $('#list').replaceChildren(shown.length ? h('div', { class: 'list' }, shown.map(row))
    : h('div', { class: 'empty panel' }, icon('bookmark'), h('b', {}, bms.length ? 'Aucun signet ici' : 'Aucun signet pour l’instant'), bms.length ? 'Changez de catégorie ou de filtre.' : ['Dans la recherche, l’icône ', icon('bookmark'), ' à droite d’une citation l’enregistre ici.']));
}

function renameCat(c) {
  const input = h('input', { value: c.name, 'aria-label': 'Nouveau nom', class: 'grow', required: '' });
  const err = h('div', { class: 'err', role: 'alert' });
  const d = modal(h('form', { onsubmit: async e => {
    e.preventDefault();
    const r = await api('/api/categories/' + c.id, { name: input.value }, 'PATCH');
    if (r.error) return err.textContent = 'Ce nom est vide ou déjà pris.';
    d.close(); load();
  } }, h('h3', {}, 'Renommer la catégorie'), h('div', { class: 'row' }, input), err,
    h('div', { class: 'row end' }, h('button', { type: 'button', class: 'ghost', onclick: () => d.close() }, 'Annuler'), h('button', {}, 'Renommer'))));
  input.select();
}

function row(b) {
  const sel = h('select', { 'aria-label': 'Catégorie', onchange: async () => { await api('/api/bookmarks/' + b.id, { category_id: sel.value ? +sel.value : null }, 'PATCH'); load(); } },
    h('option', { value: '' }, 'Sans catégorie'), cats.map(c => h('option', { value: c.id }, c.name)));
  sel.value = b.category_id || '';
  const ticks = bms.filter(x => x.video_id === b.video_id).map(x => x.start);
  const href = `/video?id=${encodeURIComponent(b.video_id)}&t=${Math.floor(b.start) + 1}`;
  return h('div', { class: 'bm' },
    thumb(b.video_id, b.title, () => location.href = href),
    h('div', {},
      h('div', { class: 'row' }, h('a', { class: 'tc', href }, icon('play'), fmt(b.start)), h('a', { class: 'muted', href: `/video?id=${encodeURIComponent(b.video_id)}` }, b.title)),
      h('div', { class: 'quote' }, b.text)),
    h('div', { class: 'acts' },
      sel,
      offlineBtn(b.video_id, b.start, b.end, b.clip, () => openDownload({ vid: b.video_id, title: b.title, dur: b.duration, start: b.start, end: b.end, ticks })),
      h('button', { class: 'iconbtn', title: 'Supprimer le signet', 'aria-label': 'Supprimer le signet', onclick: async () => { await api('/api/bookmarks/' + b.id, undefined, 'DELETE'); load(); } }, icon('trash'))));
}

$('#newcat').addEventListener('submit', async e => {
  e.preventDefault();
  const r = await api('/api/categories', { name: $('#catname').value });
  if (r.error) return;
  $('#catname').value = '';
  cur = r.id;
  load();
});
$('#filter').addEventListener('input', render);
document.addEventListener('clip', load);
load();
</script>
</body></html>
